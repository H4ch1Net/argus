# Checks every push and pull request the way a contributor does locally:
# eslint, prettier, the core / shell tests and the proxy tests, on the Node the
# Android build uses for its web app (22). The APK itself is built by
# android.yml.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # On a failure, show what Prettier would change (the version in the
      # lockfile can format differently from a global one).
      - name: Format
        run: |
          npm run format:check || {
            npx prettier --write . > /dev/null
            git --no-pager diff
            exit 1
          }

      - name: Core and shell tests
        run: npm test

      - name: Proxy tests
        run: npm run test:proxy

  # The Android app runs the proxy on nodejs-mobile, Node 18.20.4: every proxy
  # module must at least load there. (That build also lacks ICU, which this
  # Node has: proxy/test/portable.test.js checks for that statically.)
  android-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.4'
          cache: npm

      - name: Install (runtime dependencies only)
        run: npm ci --omit=dev

      - name: Load every proxy module on Node 18
        run: |
          # proxy/server.js itself starts listening, so its modules are loaded instead.
          for f in proxy/feeds.js proxy/feeds/*.js proxy/lib/*.js; do
            node --input-type=module -e "await import('./$f')" || { echo "::error file=$f::does not load on $(node -v)"; exit 1; }
          done
          echo "every proxy module loads on $(node -v)"

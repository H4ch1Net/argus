<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the mobile shell can use safe-area insets under the notch/cutout. -->

      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0e0e" />
    <!-- Inline SVG favicon: the ctOS mark (corner brackets and the diamond). -->

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e0e0e'/%3E%3Cpath d='M3 8V3h5M24 3h5v5M29 24v5h-5M8 29H3v-5' fill='none' stroke='%23fff' stroke-width='1.2'/%3E%3Cpath d='M16 7l9 9-9 9-9-9z' fill='none' stroke='%23d9d9d9' stroke-width='1.3'/%3E%3Cpath d='M16 13l3 3-3 3-3-3z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <!-- PWA: installable from the phone's browser menu (needs HTTPS with a trusted cert). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Argus</title>
  </head>

    <script type="module" src="/main.js"></script>
  </body>
</html>
